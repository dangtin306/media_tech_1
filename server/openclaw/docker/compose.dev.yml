services:
  openclaw-dev:
    build:
      context: ../app
      dockerfile: Dockerfile
    image: openclaw_win:latest
    user: "0:0"
    working_dir: /app
    environment:
      OPENCLAW_CONFIG_DIR: /home/node/openclaw-config
      OPENCLAW_CONFIG_PATH: /home/node/openclaw-config/openclaw.json
      OPENCLAW_STATE_DIR: /home/node/openclaw-data
      OPENCLAW_WORKSPACE_DIR: /home/node/openclaw-data/workspace
      OPENCLAW_GATEWAY_BIND: lan
      OPENCLAW_GATEWAY_TOKEN: media_tech
      OPENCLAW_GATEWAY_PORT: "8803"
      TZ: ${OPENCLAW_TZ:-UTC}
    volumes:
      - "../config:/home/node/openclaw-config"
      - "../data:/home/node/openclaw-data"
    ports:
      - "8803:8803"
      - "${OPENCLAW_BRIDGE_PORT:-18790}:18790"
      - "${OPENCLAW_MSTEAMS_PORT:-3978}:3978"
    init: true
    stdin_open: true
    tty: true
    restart: unless-stopped
    command: ["node", "openclaw.mjs", "gateway", "--force"]
